spring.application.name=enterprise-procurement-system

# ---------- Database (create this DB name in MySQL before running) ----------
spring.datasource.url=jdbc:mysql://localhost:3306/procurement_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=San11@san11
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
# validate only - Flyway owns the schema, Hibernate must never auto-create/alter it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---------- Flyway ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ---------- Server ----------
server.port=8080
# Without this, Spring hides exception messages from API responses by default -
# the frontend's error banners need the real message (e.g. "not your approval level").
server.error.include-message=always
server.error.include-binding-errors=always

# ---------- JWT ----------
# HS256 needs a secret of at least 256 bits (32+ chars). Change this for anything
# beyond local/demo use - anyone with this string can mint valid tokens.
jwt.secret=change-this-demo-secret-key-to-something-random-and-at-least-32-chars-long
jwt.expiration-hours=3

